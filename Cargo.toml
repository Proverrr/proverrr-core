[package]
name = "proverrr-core"
version = "0.2.0-rc-1"
edition = "2024"
description = "Light-weight library for solving geometric problems with exact arithmetic"
license = "MIT"
repository = "https://github.com/Proverrr/proverrr-core"
readme = "README.md"

[dependencies]

[lib]
crate-type = ["cdylib", "rlib"]

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
